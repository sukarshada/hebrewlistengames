<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קוראים עברית בבית הספר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700&family=Noto+Sans+Hebrew:wght@500;700;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #fff4e6;
  --bg2: #e7f5ff;
  --ink: #2b2d42;
  --muted: #6c757d;
  --card: #ffffff;
  --pink: #ff6b9d;
  --orange: #ff922b;
  --yellow: #ffd43b;
  --green: #51cf66;
  --blue: #4dabf7;
  --purple: #9775fa;
  --red: #ff6b6b;
  --shadow: 0 6px 0 rgba(0,0,0,.08), 0 10px 24px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Rubik", "Noto Sans Hebrew", "Noto Sans Arabic", system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1) 0%, #fff0f6 45%, var(--bg2) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  direction: rtl;
}
/* floating decorations */
body::before {
  content: "✏️ 📚 ⭐ 🎒 📏 ✂️ 🖍️ 📖";
  position: fixed; inset: 0; pointer-events: none;
  font-size: 34px; letter-spacing: 90px; line-height: 180px;
  opacity: .07; word-break: break-all; z-index: 0;
}
.wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 16px 16px 90px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.home-btn {
  text-decoration: none; background: var(--card); color: var(--ink);
  padding: 10px 16px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow);
}
.score-pill { background: var(--yellow); padding: 10px 16px; border-radius: 999px; font-weight: 800; box-shadow: var(--shadow); }

h1.title {
  text-align: center; margin: 10px 0 2px; font-size: clamp(30px, 6vw, 52px);
  font-weight: 900;
}
h1.title .g {
  background: linear-gradient(90deg, var(--pink), var(--orange), var(--purple), var(--blue));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.subtitle { text-align: center; margin: 0 0 6px; font-size: 20px; color: var(--muted); }
.subtitle-ar { text-align: center; margin: 0 0 18px; font-size: 18px; color: var(--purple); font-weight: 600; }

/* home cards */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin-top: 10px; }
.game-card {
  display: block; text-decoration: none; color: #fff; border-radius: 28px; padding: 22px 18px;
  box-shadow: var(--shadow); transition: transform .15s; position: relative; overflow: hidden; min-height: 190px;
}
.game-card:hover, .game-card:focus-visible { transform: translateY(-5px) rotate(-1deg); }
.game-card .icon { font-size: 54px; display: block; margin-bottom: 6px; }
.game-card h2 { margin: 0 0 4px; font-size: 26px; }
.game-card .ar { font-size: 17px; opacity: .95; font-weight: 600; }
.game-card p { margin: 8px 0 0; font-size: 15px; opacity: .95; }
.c1 { background: linear-gradient(135deg, #ff6b9d, #ff922b); }
.c2 { background: linear-gradient(135deg, #4dabf7, #9775fa); }
.c3 { background: linear-gradient(135deg, #20c997, #51cf66); }
.c4 { background: linear-gradient(135deg, #ffa94d, #fcc419); color: #3d2b00; }
.c5 { background: linear-gradient(135deg, #cc5de8, #f06595); }

/* category chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 18px; }
.chip {
  border: 3px solid transparent; background: var(--card); padding: 8px 14px; border-radius: 999px;
  font: inherit; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); font-size: 15px;
}
.chip small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.chip.on { border-color: var(--ink); transform: scale(1.04); }

/* game panel */
.panel { background: var(--card); border-radius: 32px; padding: 24px 18px; box-shadow: var(--shadow); text-align: center; }
.instructions { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
.instructions-ar { font-size: 17px; margin: 0 0 16px; color: var(--purple); font-weight: 600; }

.big-word {
  font-family: "Noto Sans Hebrew", "Rubik", sans-serif; font-weight: 700;
  font-size: clamp(54px, 13vw, 110px); line-height: 1.35; margin: 8px 0; letter-spacing: 2px;
}
.emoji-big { font-size: clamp(60px, 14vw, 100px); line-height: 1.1; }
.meaning { color: var(--muted); font-size: 18px; }

.btn {
  font: inherit; font-weight: 800; font-size: 20px; border: 0; cursor: pointer;
  padding: 14px 24px; border-radius: 20px; color: #fff; background: var(--blue);
  box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s; margin: 6px;
  display: inline-flex; align-items: center; gap: 8px; min-height: 56px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pink { background: var(--pink); }
.btn.green { background: var(--green); }
.btn.orange { background: var(--orange); }
.btn.purple { background: var(--purple); }
.btn.red { background: var(--red); }
.btn.ghost { background: #f1f3f5; color: var(--ink); }
.btn.huge { font-size: 28px; padding: 20px 34px; border-radius: 26px; }
.btn.recording { background: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

.options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
.option {
  font-family: "Noto Sans Hebrew", "Rubik", sans-serif; font-weight: 700;
  font-size: clamp(30px, 7vw, 50px); padding: 18px 8px; border-radius: 24px; cursor: pointer;
  border: 4px solid #e9ecef; background: #fff; color: var(--ink); line-height: 1.4;
  transition: transform .1s, background .2s;
}
.option:hover { transform: scale(1.03); border-color: var(--blue); }
.option.correct { background: #d3f9d8; border-color: var(--green); animation: pop .4s; }
.option.wrong { background: #ffe3e3; border-color: var(--red); animation: shake .4s; }
@keyframes pop { 50% { transform: scale(1.1); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

.syllables { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 12px 0; direction: rtl; }
.syl {
  font-family: "Noto Sans Hebrew", "Rubik", sans-serif; font-weight: 700;
  font-size: clamp(40px, 10vw, 80px); padding: 6px 14px; border-radius: 18px; cursor: pointer;
  background: #f8f9fa; border: 3px solid transparent; transition: all .2s; line-height: 1.4;
}
.syl.space { background: none; padding: 0 10px; cursor: default; }
.syl.lit { transform: translateY(-8px) scale(1.12); color: #fff; }
.s0 { color: #e8590c; } .s1 { color: #1c7ed6; } .s2 { color: #2f9e44; } .s3 { color: #ae3ec9; } .s4 { color: #e03131; }
.syl.lit.s0 { background: #ff922b; } .syl.lit.s1 { background: #339af0; } .syl.lit.s2 { background: #51cf66; }
.syl.lit.s3 { background: #cc5de8; } .syl.lit.s4 { background: #ff6b6b; }

.progress { height: 14px; background: #f1f3f5; border-radius: 999px; overflow: hidden; margin: 0 0 16px; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--pink), var(--yellow), var(--green)); width: 0; transition: width .4s; }

.stars { font-size: 44px; letter-spacing: 6px; margin: 10px 0; }
.star-btn { font-size: 46px; background: none; border: 0; cursor: pointer; filter: grayscale(1); opacity: .5; transition: all .15s; }
.star-btn.on { filter: none; opacity: 1; transform: scale(1.15); }

.feedback { font-size: 26px; font-weight: 800; min-height: 40px; margin: 10px 0; }
.feedback.good { color: var(--green); } .feedback.bad { color: var(--red); }

.hint { background: #fff9db; border-radius: 16px; padding: 10px 14px; margin: 12px auto 0; max-width: 520px; font-size: 16px; }
.note { font-size: 14px; color: var(--muted); margin-top: 12px; }

.result h2 { font-size: 40px; margin: 6px 0; }
.timer-bar { height: 10px; background: #f1f3f5; border-radius: 999px; overflow: hidden; margin: 10px auto; max-width: 420px; }
.timer-bar > div { height: 100%; background: var(--orange); width: 100%; }

footer.credit {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 5; text-align: center;
  background: linear-gradient(90deg, #ff6b9d, #9775fa, #4dabf7); color: #fff;
  padding: 10px 12px; font-weight: 700; font-size: 17px; box-shadow: 0 -4px 14px rgba(0,0,0,.12);
}
footer.credit span { font-family: "Noto Sans Arabic", "Rubik", sans-serif; }

.confetti { position: fixed; top: -20px; font-size: 26px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (max-width: 480px) {
  .options { grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { font-size: 18px; padding: 12px 18px; }
  .panel { padding: 20px 12px; border-radius: 26px; }
}

/* back button */
.back-btn {
  text-decoration: none; color: #fff; font-weight: 800; font-size: 20px;
  background: linear-gradient(135deg, #9775fa, #4dabf7); padding: 12px 20px; border-radius: 999px;
  box-shadow: 0 5px 0 rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 8px; min-height: 52px;
}
.back-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }

/* start screen */
.gate {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
  background: rgba(255, 244, 230, .88); backdrop-filter: blur(4px);
}
.gate-btn { font-size: 34px; padding: 26px 44px; flex-direction: column; animation: pulse 1.4s infinite; line-height: 1.3; }
.gate-btn span { font-size: 26px; font-family: "Noto Sans Arabic", "Rubik", sans-serif; }

/* star pop after a correct answer */
.pop-star {
  position: fixed; top: 38%; left: 50%; z-index: 60; pointer-events: none; text-align: center;
  font-size: 110px; transform: translate(-50%, -50%) scale(.2); animation: starpop 1.5s ease-out forwards;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,.2));
}
.pop-star span { display: block; font-size: 30px; font-weight: 900; color: #e8590c; background: #fff; border-radius: 999px; padding: 6px 18px; margin-top: -6px; white-space: nowrap; }
@keyframes starpop {
  0% { transform: translate(-50%, -50%) scale(.2) rotate(-30deg); opacity: 0; }
  25% { transform: translate(-50%, -50%) scale(1.15) rotate(8deg); opacity: 1; }
  45% { transform: translate(-50%, -50%) scale(1) rotate(0); }
  80% { opacity: 1; }
  100% { transform: translate(-50%, -80%) scale(.9); opacity: 0; }
}

  .slots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 14px 0; min-height: 110px; }
  .slot { min-width: 90px; min-height: 100px; border: 4px dashed #ced4da; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 4px 10px; }
  .slot.gap { border: 0; min-width: 24px; }
  .slot .syl { cursor: default; }
  .tiles { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .tile { box-shadow: 0 5px 0 rgba(0,0,0,.12); background: #fff; border: 3px solid #e9ecef; }
  .tile:hover { transform: translateY(-4px); }
  .tile.used { visibility: hidden; }
  .tile.wrong { animation: shake .4s; border-color: var(--red); }
</style>
</head>

const stripNikud = (t) => t.replace(/[֑-ׇ]/g, "");
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);

// ---- saved category choice (safe if storage is blocked) ----
function getCat() { try { return localStorage.getItem("hrg-cat") || "all"; } catch (e) { return window.__cat || "all"; } }
function setCat(c) { window.__cat = c; try { localStorage.setItem("hrg-cat", c); } catch (e) {} }
function wordsForCat() {
  const c = getCat();
  const list = c === "all" ? WORDS : WORDS.filter(w => w.c === c);
  return list.length >= 4 ? list : WORDS;
}

function renderChips(el, onChange) {

// ---- speech: best Hebrew voice in the browser, or an online Hebrew voice as backup ----
let heVoice = null;
function findVoice() {
  if (!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^(he|iw)/i.test(v.lang));
  const score = (v) => (/natural|online|neural/i.test(v.name) ? 4 : 0) + (/hila|avri|google/i.test(v.name) ? 2 : 0) + (v.localService ? 0 : 1);
  heVoice = vs.sort((a, b) => score(b) - score(a))[0] || null;
  return heVoice;
}
// voices load a moment after the page opens, so wait for them (max ~1.5s)
const voicesReady = new Promise((res) => {
  if (!("speechSynthesis" in window)) return res();
  if (findVoice()) return res();
  speechSynthesis.onvoiceschanged = () => { if (findVoice()) res(); };
  setTimeout(() => { findVoice(); res(); }, 1500);
});

let currentAudio = null, speakId = 0;
function stopSpeech() {
  try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}
function onlineVoice(text, slow, variant = 0) {
  const clients = ["tw-ob", "gtx"];
  return "https://translate.google.com/translate_tts?ie=UTF-8&tl=iw&client=" + clients[variant] +
    "&ttsspeed=" + (slow ? "0.3" : "1") + "&q=" + encodeURIComponent(text);
}
async function speak(text, slow = false) {
  const my = ++speakId;
  stopSpeech();
  await voicesReady;
  if (my !== speakId) return;
  if (heVoice) {
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = heVoice; u.lang = heVoice.lang; u.rate = slow ? 0.55 : 0.9;
      let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
      setTimeout(fin, 7000);
    });
  }
  // backup: online Hebrew voice (needs internet)
  for (let v = 0; v < 2; v++) {
    const ok = await new Promise((resolve) => {
      const a = new Audio(onlineVoice(text, slow, v));
      currentAudio = a;
      a.onended = () => resolve(true);
      a.onerror = () => resolve(false);
      a.play().catch(() => resolve(false));
      setTimeout(() => resolve(true), 8000);
    });
    if (ok || my !== speakId) return;
  }
  showVoiceWarning();
}
function showVoiceWarning() {
  if ($("#voice-warn")) return;

let actx = null;
function beep(freqs, dur = 0.12) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t = actx.currentTime + i * dur;
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}

    $("#rec").classList.remove("recording");
    $("#rec").textContent = "🎤 שׁוּב · سجّل مرة أخرى";
    myUrl = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType }));
    $("#mine").disabled = false;
    $("#rate").style.display = "block";
    $("#fb").textContent = "הַקְשִׁיבוּ לְעַצְמְכֶם וְלַמּוֹדֶל 👂 · استمع لنفسك ثم للنطق الصحيح";
    $("#fb").className = "feedback";
    new Audio(myUrl).play().then(() => {}).catch(() => {});
  };
  recorder.start();
  $("#rec").classList.add("recording");
  $("#rec").textContent = "⏹️ עֲצִירָה · أوقف";
  recTimer = setTimeout(() => recorder.state === "recording" && recorder.stop(), 5000);
}

// optional automatic check (Chrome / Edge)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) $("#auto-wrap").style.display = "block";
function autoCheck() {
  const w = list[idx];
  const r = new SR();
  r.lang = "he-IL"; r.maxAlternatives = 5; r.interimResults = false;
  $("#fb").textContent = "🎧 קִרְאוּ עַכְשָׁו… · اقرأ الآن…"; $("#fb").className = "feedback";
  r.onresult = (e) => {
    const target = stripNikud(w.w).replace(/\s/g, "");
    const heard = [...e.results[0]].map(a => stripNikud(a.transcript).replace(/[\s.,!?]/g, ""));
    if (heard.some(h => h === target || h.includes(target))) {
      $("#fb").textContent = "✅ " + praise(); $("#fb").className = "feedback good"; celebrate();
    } else {
      $("#fb").textContent = "🤔 נַסּוּ שׁוּב, הַקְשִׁיבוּ לַמּוֹדֶל · حاول مرة أخرى"; $("#fb").className = "feedback bad";
    }
    $("#rate").style.display = "block";
  };
  r.onerror = () => { $("#fb").textContent = "🎤 לֹא שָׁמַעְתִּי, נַסּוּ שׁוּב · لم أسمع، حاول مرة أخرى"; $("#fb").className = "feedback bad"; };
  r.start();
}

function finish() {
  $("#bar").style.width = "100%";
  sndWin(); confetti();
  $("#game").innerHTML = `<div class="result">
    <h2>🎉 קְרָאתֶם ${list.length} מִלִּים!</h2>
    <p class="instructions-ar">قرأت ${list.length} كلمات!</p>
    <div class="stars">${starsFor(total, list.length * 3)}</div>
    <button class="btn huge green" onclick="openGame(\'record\')">🔄 עוֹד פַּעַם · مرة أخرى</button>
    <a class="btn purple" href="#">🏠 מִשְׂחָק אַחֵר · لعبة أخرى</a>
  </div>`;
}

$("#rec").onclick = startRec;
$("#mine").onclick = () => myUrl && new Audio(myUrl).play();
$("#model").onclick = () => speak(list[idx].w);
$("#slow").onclick = () => speak(list[idx].w, true);
$("#auto").onclick = autoCheck;
document.querySelectorAll(".star-btn").forEach(b => b.onclick = () => {
  rating = +b.dataset.n;
  document.querySelectorAll(".star-btn").forEach(s => s.classList.toggle("on", +s.dataset.n <= rating));
  if (rating >= 2) celebrate(rating === 3 ? "מְצֻיָּן! ممتاز!" : "יוֹפִי! رائع!"); else sndGood();
});
$("#next").onclick = () => {
  total += rating; $("#score").textContent = total;
  $("#rec").textContent = "🎤 הַקְלָטָה · سجّل";
  idx++; show();
};
$("#prev").onclick = () => { if (idx > 0) { idx--; show(); } };
startGate(() => { show(); speak(list[idx].w); });

} },
  readalong: { html: "\n  <div class=\"topbar\">\n    <a class=\"back-btn\" href=\"#\">➡️ חֲזָרָה · رجوع</a>\n    <div class=\"score-pill\"><span id=\"count\">1</span> / <span id=\"of\">0</span></div>\n  </div>\n  <h1 class=\"title\">🎶 <span class=\"g\">קוֹרְאִים יַחַד</span></h1>\n  <p class=\"subtitle-ar\">المقاطع تضيء واحدًا تلو الآخر — اقرأ معها!</p>\n\n  <div class=\"panel\">\n    <p class=\"instructions\">1️⃣ ▶️ הַקְשִׁיבוּ  2️⃣ 🗣️ קִרְאוּ לְבַד כְּשֶׁהַהֲבָרוֹת נִדְלָקוֹת</p>\n    <p class=\"instructions-ar\">١) استمع  ٢) اقرأ وحدك عندما تضيء المقاطع</p>\n\n    <div class=\"emoji-big\" id=\"emoji\"></div>\n    <div class=\"syllables\" id=\"syl\"></div>\n    <div class=\"meaning\" id=\"meaning\"></div>\n\n    <div style=\"margin-top:14px\">\n      <button class=\"btn huge pink\" id=\"listen\">▶️ הַקְשִׁיבוּ · استمع</button>\n      <button class=\"btn huge purple\" id=\"you\">🗣️ עַכְשָׁו אַתֶּם · دورك</button>\n    </div>\n    <div class=\"feedback\" id=\"fb\"></div>\n    <div>\n      <button class=\"btn ghost\" id=\"prev\">➡️ הַקּוֹדֶמֶת · السابقة</button>\n      <button class=\"btn green\" id=\"next\">הַבָּאָה · التالية ⬅️</button>\n    </div>\n    <p class=\"note\">לַחֲצוּ עַל הֲבָרָה כְּדֵי לִשְׁמֹעַ אוֹתָהּ · اضغط على أي مقطع لسماعه</p>\n  </div>\n",
    run: function () {

const list = shuffle(wordsForCat());
let idx = 0, busy = false;
$("#of").textContent = list.length;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function show() {
  const w = list[idx];
  $("#count").textContent = idx + 1;
  $("#emoji").textContent = w.e;
  $("#syl").innerHTML = syllableHTML(w);
  $("#meaning").textContent = w.ar;
  $("#fb").textContent = "";
  $("#syl").querySelectorAll(".syl[data-p]").forEach(s => s.onclick = () => { if (!busy) speak(s.dataset.p, true); });
}
const parts = () => [...$("#syl").querySelectorAll(".syl[data-p]")];
const clear = () => parts().forEach(p => p.classList.remove("lit"));

async function listen() {
  if (busy) return; busy = true;
  const ps = parts();
  if (ps.length > 1) {
    for (const p of ps) { clear(); p.classList.add("lit"); await speak(p.dataset.p, true); await sleep(250); }
  }
  ps.forEach(p => p.classList.add("lit"));
  await speak(list[idx].w);
  await sleep(400); clear(); busy = false;
}

async function yourTurn() {
  if (busy) return; busy = true;
  $("#fb").textContent = "🗣️ קִרְאוּ בְּקוֹל! · اقرأ بصوت عالٍ!"; $("#fb").className = "feedback";
  await sleep(700);
  for (const p of parts()) { clear(); p.classList.add("lit"); await sleep(1000); }
  parts().forEach(p => p.classList.add("lit"));
  await sleep(1200);
  $("#fb").textContent = "👂 עַכְשָׁו בִּדְקוּ · الآن تحقّق";
  await speak(list[idx].w);
  $("#fb").textContent = praise(); $("#fb").className = "feedback good"; celebrate();
  clear(); busy = false;
}

$("#listen").onclick = listen;
$("#you").onclick = yourTurn;
$("#next").onclick = () => { if (busy) return; idx = (idx + 1) % list.length; if (idx === 0) confetti(60); show(); };
$("#prev").onclick = () => { if (busy) return; idx = (idx - 1 + list.length) % list.length; show(); };
show();
startGate(listen);

} },
  speed: { html: "\n  <div class=\"topbar\">\n    <a class=\"back-btn\" href=\"#\">➡️ חֲזָרָה · رجوع</a>\n    <div class=\"score-pill\">⭐ <span id=\"score\">0</span></div>\n  </div>\n  <h1 class=\"title\">⚡ <span class=\"g\">קְרִיאָה מְהִירָה</span></h1>\n  <p class=\"subtitle-ar\">الكلمة تظهر للحظة — اقرأها بسرعة وبصوت عالٍ!</p>\n\n  <div class=\"panel\" id=\"game\">\n    <div id=\"levels\">\n      <p class=\"note\" style=\"margin-top:0\">🔊 הַדְלִיקוּ רַמְקוֹל · شغّلوا الصوت</p>\n      <p class=\"instructions\">בַּחֲרוּ רָמָה · اختر المستوى</p>\n      <button class=\"btn huge green\" data-t=\"3000\" data-n=\"1\">🐢 לְאַט · بطيء</button>\n      <button class=\"btn huge orange\" data-t=\"2000\" data-n=\"1\">🐇 מַהֵר · سريع</button>\n      <button class=\"btn huge red\" data-t=\"1300\" data-n=\"1\">🚀 מַהֵר מְאוֹד · سريع جدًا</button>\n      <button class=\"btn huge purple\" data-t=\"2500\" data-n=\"0\">🏆 אַלּוּפִים — בְּלִי נִקּוּד · الأبطال — بدون تشكيل</button>\n    </div>\n\n    <div id=\"play\" style=\"display:none\">\n      <div class=\"progress\"><div id=\"bar\"></div></div>\n      <div class=\"timer-bar\"><div id=\"timer\"></div></div>\n      <div class=\"big-word\" id=\"word\" style=\"min-height:1.4em\"></div>\n      <div class=\"emoji-big\" id=\"emoji\" style=\"min-height:1.1em\"></div>\n      <div class=\"feedback\" id=\"fb\"></div>\n      <div id=\"check\" style=\"display:none\">\n        <p class=\"instructions\">קְרָאתֶם נָכוֹן? · هل قرأت صحيحًا؟</p>\n        <button class=\"btn huge green\" id=\"yes\">✅ כֵּן · نعم</button>\n        <button class=\"btn huge red\" id=\"no\">❌ לֹא · لا</button>\n        <div><button class=\"btn ghost\" id=\"again\">🔊 שׁוּב · مرة أخرى</button></div>\n      </div>\n    </div>\n  </div>\n",
    run: function () {

const ROUNDS = 10;
let list, idx = 0, score = 0, showTime = 2000, withNikud = true;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

document.querySelectorAll("#levels .btn").forEach(b => b.onclick = () => {
  showTime = +b.dataset.t; withNikud = b.dataset.n === "1";
  list = pick(wordsForCat(), ROUNDS);
  $("#levels").style.display = "none"; $("#play").style.display = "block";
  round();
});

async function round() {
  if (idx >= list.length) return finish();
  const w = list[idx];
  $("#bar").style.width = (idx / list.length * 100) + "%";
  $("#check").style.display = "none"; $("#emoji").textContent = ""; $("#fb").textContent = "";
  $("#word").style.color = "var(--muted)";
  for (const n of ["3", "2", "1"]) { $("#word").textContent = n; beep([440], 0.08); await sleep(550); }
  $("#word").style.color = "";
  $("#word").textContent = withNikud ? w.w : stripNikud(w.w);
  const t = $("#timer"); t.style.transition = "none"; t.style.width = "100%";
  requestAnimationFrame(() => requestAnimationFrame(() => { t.style.transition = `width ${showTime}ms linear`; t.style.width = "0%"; }));
  $("#fb").textContent = "🗣️ קִרְאוּ בְּקוֹל! · اقرأ بصوت عالٍ!"; $("#fb").className = "feedback";
  await sleep(showTime);
  $("#word").textContent = "❔";
  await sleep(1500);
  $("#word").textContent = w.w; $("#emoji").textContent = w.e;
  $("#fb").textContent = w.ar;
  await speak(w.w);
  $("#check").style.display = "block";
}

function answer(ok) {
  if (ok) { score++; $("#score").textContent = score; celebrate(); } else { sndBad(); }
  idx++; setTimeout(round, ok ? 1200 : 300);
}
$("#yes").onclick = () => answer(true);
$("#no").onclick = () => answer(false);
$("#again").onclick = () => speak(list[idx].w);

function finish() {
  $("#bar").style.width = "100%";
  sndWin(); confetti();
  $("#game").innerHTML = `<div class="result">
    <h2>⚡ ${score} / ${ROUNDS}</h2>
    <div class="stars">${starsFor(score, ROUNDS)}</div>
    <p class="instructions">${score >= 8 ? "אַתֶּם קוֹרְאִים מְהִירִים! · أنت قارئ سريع!" : "כָּל פַּעַם יוֹתֵר מַהֵר! · كل مرة أسرع!"}</p>
    <button class="btn huge green" onclick="openGame(\'speed\')">🔄 עוֹד פַּעַם · مرة أخرى</button>
    <a class="btn purple" href="#">🏠 מִשְׂחָק אַחֵר · لعبة أخرى</a>
  </div>`;
}

} },
  syllables: { html: "\n  <div class=\"topbar\">\n    <a class=\"back-btn\" href=\"#\">➡️ חֲזָרָה · رجوع</a>\n    <div class=\"score-pill\">⭐ <span id=\"score\">0</span></div>\n  </div>\n  <h1 class=\"title\">🧩 <span class=\"g\">בּוֹנִים מִלָּה</span></h1>\n  <p class=\"subtitle-ar\">رتّب المقاطع بالترتيب الصحيح (من اليمين إلى اليسار)</p>\n\n  <div class=\"panel\" id=\"game\">\n    <div class=\"progress\"><div id=\"bar\"></div></div>\n    <p class=\"instructions\">לַחֲצוּ עַל הַחֲלָקִים לְפִי הַסֵּדֶר — מִיָּמִין לִשְׂמֹאל ⬅️</p>\n    <p class=\"instructions-ar\">اضغط على القطع بالترتيب — من اليمين إلى اليسار ⬅️</p>\n    <div class=\"emoji-big\" id=\"emoji\"></div>\n    <div class=\"meaning\" id=\"meaning\"></div>\n    <div>\n      <button class=\"btn pink\" id=\"play\">🔊 הַקְשִׁיבוּ · استمع</button>\n      <button class=\"btn ghost\" id=\"slow\">🐢 לְאַט</button>\n    </div>\n    <div class=\"slots\" id=\"slots\"></div>\n    <div class=\"tiles\" id=\"tiles\"></div>\n    <div class=\"feedback\" id=\"fb\"></div>\n  </div>\n",
    run: function () {

const ROUNDS = 8;
const multi = (w) => w.s.filter(p => p !== " ").length >= 2;
let pool = wordsForCat().filter(multi); if (pool.length < ROUNDS) pool = WORDS.filter(multi);
const list = pick(pool, ROUNDS);
let idx = 0, score = 0, parts = [], placed = 0, mistakes = 0;

function show() {
  if (idx >= list.length) return finish();
  const w = list[idx];
  placed = 0; mistakes = 0;
  $("#bar").style.width = (idx / list.length * 100) + "%";
  $("#emoji").textContent = w.e; $("#meaning").textContent = w.ar;
  $("#fb").textContent = ""; $("#fb").className = "feedback";
  parts = w.s.filter(p => p !== " ");
  let k = 0;
  $("#slots").innerHTML = w.s.map(p => p === " " ? `<div class="slot gap"></div>` : `<div class="slot" data-slot="${k++}"></div>`).join("");
  let order = shuffle(parts.map((p, i) => i));
  while (order.every((v, i) => v === i)) order = shuffle(order);
  $("#tiles").innerHTML = order.map(i => `<span class="syl tile s${i % 5}" data-i="${i}">${parts[i]}</span>`).join("");
  $("#tiles").querySelectorAll(".tile").forEach(t => t.onclick = () => tap(t));
  setTimeout(() => speak(w.w), 300);
}

function tap(t) {
  const i = +t.dataset.i;
  if (parts[i] === parts[placed]) { // same text also counts (e.g. repeated syllables)
    const slot = $(`[data-slot="${placed}"]`);
    slot.innerHTML = `<span class="syl s${placed % 5}">${parts[placed]}</span>`;
    t.classList.add("used"); placed++;
    speak(parts[placed - 1], true);
    if (placed === parts.length) done();
  } else {
    mistakes++; sndBad(); t.classList.remove("wrong"); void t.offsetWidth; t.classList.add("wrong");
    $("#fb").textContent = "לֹא זֶה, נַסּוּ שׁוּב · ليست هذه، حاول مرة أخرى"; $("#fb").className = "feedback bad";
  }
}

async function done() {
  const w = list[idx];
  if (mistakes === 0) { score++; $("#score").textContent = score; }
  celebrate();
  document.querySelectorAll("#slots .syl").forEach(s => s.classList.add("lit"));
  $("#fb").textContent = praise(); $("#fb").className = "feedback good";
  await new Promise(r => setTimeout(r, 500));
  await speak(w.w);
  idx++; setTimeout(show, 1300);
}

function finish() {
  $("#bar").style.width = "100%";
  sndWin(); confetti();
  $("#game").innerHTML = `<div class="result">
    <h2>🧩 בְּנִיתֶם ${list.length} מִלִּים!</h2>
    <p class="instructions-ar">ركّبت ${list.length} كلمات!</p>
    <div class="stars">${starsFor(score, list.length)}</div>
    <button class="btn huge green" onclick="openGame(\'syllables\')">🔄 עוֹד פַּעַם · مرة أخرى</button>
    <a class="btn purple" href="#">🏠 מִשְׂחָק אַחֵר · لعبة أخرى</a>
  </div>`;
}
$("#play").onclick = () => speak(list[idx].w);
$("#slow").onclick = () => speak(list[idx].w, true);
startGate(show);

} },
};
function openGame(name) {
  let t = setTimeout(() => {}, 0); while (t--) clearTimeout(t);   // stop the previous game
  stopSpeech();
  document.querySelectorAll(".gate, .confetti, .pop-star, #voice-warn").forEach(e => e.remove());
  const page = PAGES[name] || PAGES.home;
  document.getElementById("app").innerHTML = page.html;
  window.scrollTo(0, 0);
  page.run();
}
window.addEventListener("hashchange", () => openGame(location.hash.slice(1)));
openGame(location.hash.slice(1));
</script>
